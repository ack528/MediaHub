[package]
name = "mediahub-desktop"
version = "1.7.0"
description = "MediaHub 桌面管理程序"
edition = "2021"

[lib]
name = "mediahub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只访问本机 http://127.0.0.1,不需要 TLS
ureq = { version = "3", default-features = false }
local-ip-address = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
